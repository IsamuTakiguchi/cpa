<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- CPA論文 2027 のアプリアイコン（元データ）。答案用紙と万年筆のペン先 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2d5a8e"/>
      <stop offset="1" stop-color="#132a47"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.28" cy="0.2" r="0.7">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="nib" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fcd34d"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0b1a2e" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>

  <!-- 答案用紙 -->
  <g transform="rotate(-7 470 520)" filter="url(#shadow)">
    <rect x="210" y="190" width="520" height="650" rx="36" fill="#f8fafc"/>
    <g stroke="#9fb3cc" stroke-width="6" fill="none">
      <!-- 原稿用紙のマス目 -->
      <path d="M262 290h416M262 360h416M262 430h416M262 500h416M262 570h416M262 640h416M262 710h416"/>
      <path d="M262 290v420M331 290v420M400 290v420M469 290v420M538 290v420M607 290v420M678 290v420"/>
    </g>
    <!-- 書き込み（琥珀色のライン） -->
    <path d="M276 778c70-24 140-26 210-10" stroke="#f59e0b" stroke-width="22" stroke-linecap="round" fill="none"/>
  </g>

  <!-- 万年筆のペン先 -->
  <g transform="translate(615 610) rotate(38) scale(0.9)" filter="url(#shadow)">
    <path d="M-70 -318 L70 -318 L86 -120 Q96 -60 60 0 L8 120 Q0 140 -8 120 L-60 0 Q-96 -60 -86 -120 Z" fill="url(#nib)"/>
    <path d="M0 -10 L0 118" stroke="#7c2d12" stroke-width="10" stroke-linecap="round"/>
    <circle cx="0" cy="-40" r="22" fill="#7c2d12"/>
    <rect x="-98" y="-424" width="196" height="118" rx="26" fill="#0f2238"/>
    <rect x="-98" y="-424" width="196" height="22" rx="11" fill="#ffffff" opacity="0.18"/>
  </g>
</svg>
